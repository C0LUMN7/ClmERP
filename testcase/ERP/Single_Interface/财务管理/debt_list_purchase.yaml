- baseInfo:
    api_name: 查询采购欠款单
    url: /depotHead/debtList
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 查询采购欠款单-提取欠款信息用于付款
      params:
        currentPage: 1
        pageSize: 1000
        type: "入库"
        subType: "采购"
        organId: 196
      extract:
        purchaseDebtId: $.data.rows[0].id
        purchaseBillNumber: $.data.rows[0].number
        purchaseNeedDebt: $.data.rows[0].needDebt
        purchaseOrganId: $.data.rows[0].organId
        purchaseAccountId: $.data.rows[0].accountId
      validation:
        - contains: { 'code': 200, 'message': '成功' }
