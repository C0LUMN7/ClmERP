- baseInfo:
    api_name: 新增付款单（采购付款）
    url: /accountHead/addAccountHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 对采购欠款单新增付款单
      json:
        info: '{"organId":${get_extract_data(purchaseOrganId)},"billTime":"${end_time()}","billNo":"FK_${fixed_timestamp()}","accountId":${get_extract_data(purchaseAccountId)},"totalPrice":-${get_extract_data(purchaseNeedDebt)},"discountMoney":0,"changeAmount":-${get_extract_data(purchaseNeedDebt)},"type":"付款","status":"0"}'
        rows: '[{"id":"${get_extract_data(purchaseDebtId)}","billNumber":"${get_extract_data(purchaseBillNumber)}","needDebt":"${get_extract_data(purchaseNeedDebt)}","finishDebt":"0","eachAmount":"${get_extract_data(purchaseNeedDebt)}","remark":""}]'
      validation:
        - contains: { 'code': 200 , 'msg': '操作成功'}