- baseInfo:
    api_name: 查询销售欠款单
    url: /depotHead/debtList
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 查询销售欠款单-提取欠款信息用于收款
      params:
        currentPage: 1
        pageSize: 1000
        type: "出库"
        subType: "销售"
        organId: 204
      extract:
        salesDebtId: $.data.rows[0].id
        salesBillNumber: $.data.rows[0].number
        salesNeedDebt: $.data.rows[0].needDebt
        salesOrganId: $.data.rows[0].organId
        salesAccountId: $.data.rows[0].accountId
      validation:
        - contains: { 'code': 200, 'message': '成功' }
