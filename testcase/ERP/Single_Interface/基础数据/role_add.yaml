- baseInfo:
    api_name: 新增角色
    url: /role/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 正常新增角色
      json:
        name: 测试角色${fixed_timestamp()}
      validation:
        - contains: { 'code': 200, 'message': '成功' }
