- baseInfo:
    api_name: 新增销售出库单
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 使用生成的商品条码新增销售出库单
      json:
        info: '{"number":"SO_${fixed_timestamp()}","type":"出库","subType":"销售","organId":1,"accountId":1,"totalPrice":100,"changeAmount":0,"payType":"现付","billTime":"2026-06-13","remark":"单接口_新增_SO_${fixed_timestamp()}"}'
        rows: '[{"barCode":"${get_extract_data(barCode)}","depotId":1,"operNumber":10,"unitPrice":10,"totalPrice":100,"unit":"个","remark":"单接口_新增明细_${fixed_timestamp()}"}]'
        preTotalPrice: 0
      validation:
        - contains: { 'code': 200 }
