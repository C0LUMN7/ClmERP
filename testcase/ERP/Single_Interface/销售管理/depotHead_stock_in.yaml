- baseInfo:
    api_name: 采购入库补充库存
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 采购入库-为销售出库准备库存
      json:
        info: '{"number":"SI_${fixed_timestamp()}","type":"入库","subType":"采购","organId":1,"accountId":1,"totalPrice":100,"changeAmount":0,"payType":"现付","billTime":"2026-06-13","remark":"销售测试_入库_SI_${fixed_timestamp()}"}'
        rows: '[{"barCode":"${get_extract_data(barCode)}","depotId":1,"operNumber":100,"unitPrice":10,"totalPrice":1000,"unit":"个","remark":"销售测试_入库明细_${fixed_timestamp()}"}]'
        preTotalPrice: 0
      validation:
        - contains: { 'code': 200 }
