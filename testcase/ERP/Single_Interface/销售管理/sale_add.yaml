- baseInfo:
    api_name: 创建商品（销售出库用）
    url: /material/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建销售专用商品（AUTO_API_SALES_ 前缀）
      json:
        name: AUTO_API_SALES_${fixed_timestamp()}
        brand: 笑容加
        mnemonic: ddys
        categoryId: ${get_business_id(category_id)}
        unit: 支
        meList:
          - barCode: "${gen_bar_code()}"
            commodityUnit: "支"
            purchaseDecimal: "200"
            commodityDecimal: "299"
            wholesaleDecimal: "299"
            lowDecimal: "259"
        stock:
          # 仓库 ID 来自配置（cloud_test 默认示例 124），仓库名对应配置的默认仓库
          - id: "${get_business_id(depot_id)}"
            name: "自动化测试专属仓库3"
            initStock: "101"
            lowSafeStock: "1"
            highSafeStock: "9999"
      validation:
        - contains: { 'code': 200, 'message': '成功' }

- baseInfo:
    api_name: 新增销售出库单
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 新增出库单（单号 AUTO_API_SO_ 前缀，业务ID来自配置）
      json:
        info: '{"number":"AUTO_API_SO_${fixed_timestamp()}","type":"出库","subType":"销售","organId":${get_business_id(customer_organ_id)},"accountId":${get_business_id(settle_account_id)},"totalPrice":299,"changeAmount":0,"debt":299,"discount":0,"discountMoney":0,"discountLastMoney":299,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"AUTO_API_SALES_${fixed_timestamp()}","barCode":"${get_extract_data(barCode)}","depotId":${get_business_id(depot_id)},"operNumber":1,"unitPrice":299,"allPrice":299,"unit":"支","taxRate":0,"taxMoney":0,"taxLastMoney":299}]'
      validation:
        - contains: { 'code': 200 }
        - eq: { 'msg': '操作成功' }
        - db: "SELECT id FROM jsh_depot_head WHERE number = 'AUTO_API_SO_${fixed_timestamp()}' AND type = '出库' AND delete_flag = '0'"
