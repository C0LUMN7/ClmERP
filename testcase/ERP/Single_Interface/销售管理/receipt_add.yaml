- baseInfo:
    api_name: 新增收款单（销售收款）
    url: /accountHead/addAccountHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 对销售出库单新增收款单
      json:
        info: '{"organId":${get_extract_data(saleOrganId)},"billTime":"${end_time()}","billNo":"SK_${fixed_timestamp()}","accountId":105,"totalPrice":${get_extract_data(saleDebt)},"discountMoney":0,"changeAmount":${get_extract_data(saleDebt)},"type":"收款","status":"0"}'
        rows: '[{"id":"${get_extract_data(saleId)}","billNumber":"${get_extract_data(saleNumber)}","needDebt":"${get_extract_data(saleDebt)}","finishDebt":"0","eachAmount":"${get_extract_data(saleDebt)}","remark":""}]'
      validation:
        - contains: { 'code': 200 , 'msg': '操作成功'}
        - db: "SELECT id FROM jsh_account_head WHERE bill_no = 'SK_${fixed_timestamp()}' AND total_price = ${get_extract_data(saleDebt)} AND delete_flag = '0'"