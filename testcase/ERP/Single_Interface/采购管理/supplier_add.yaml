- baseInfo:
    api_name: 新增供应商
    url: /supplier/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 正常新增供应商
      json:
        supplier: 测试供应商
        type: 供应商
        phonenum: "13800000001"
        email: test@example.com
        address: 测试地址
      validation:
        - contains: { 'code': 200 }
    - case_name: 缺少供应商名称-返回301
      json:
        type: 供应商
        phonenum: "13800000003"
      validation:
        - contains: { 'code': 301 }
