- baseInfo:
    api_name: 审核采购入库单
    url: /depotHead/batchSetStatus
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 审核入库单（状态置为1）
      json:
        ids: ${get_extract_data(buyId)}
        status: "1"
      validation:
        - contains: { 'code': 200 ,'message': '成功' }
        - db: "SELECT id FROM jsh_depot_head WHERE id = ${get_extract_data(buyId)} AND status = '1' AND delete_flag = '0'"
        - db: "SELECT current_number FROM jsh_material_current_stock WHERE material_id = (SELECT id FROM jsh_material WHERE name = 'AUTO_API_PURCHASE_${fixed_timestamp()}' AND delete_flag = '0') AND depot_id = ${get_business_id(depot_id)} AND current_number = 101"

