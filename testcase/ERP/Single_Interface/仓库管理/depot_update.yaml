- baseInfo:
    api_name: 更新仓库
    url: /depot/update
    method: PUT
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 更新本次创建的仓库名称（按唯一仓库名精确查询ID）
      json:
        id: ${get_depot_id_by_name(AUTO_API_D_)}
        name: AUTO_API_U_${short_run_id()}
      validation:
        - contains: { 'code': 200, 'message': '成功' }
