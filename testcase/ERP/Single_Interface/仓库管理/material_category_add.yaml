- baseInfo:
    api_name: 新增商品类别
    url: /materialCategory/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 正常新增商品类别
      json:
        name: 测试商品类别
        parentId: 0
      validation:
        - contains: { 'code': 200 }
