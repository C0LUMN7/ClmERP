- baseInfo:
    api_name: 用户登录
    url: /user/login
    method: post
    header:
      Content-Type: application/json;charset=UTF-8
  testCase:
    - case_name: 用户名、密码和验证码正确（登录成功）
      json:
        loginName: jsh
        password: ${md5_encryption(123456)}
        code: ${get_captcha_code()}
        uuid: ${get_captcha_uuid()}
      validation:
        - contains: { 'code': 200, 'msgTip': 'user can login' }
      extract:
        token: $.data.token
