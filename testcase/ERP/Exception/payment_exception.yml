# ============================================================
# Exception Scenario 6: 收款金额大于销售单欠款金额
# ============================================================
- baseInfo:
    api_name: 创建测试商品-超额收款异常场景
    url: /material/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建商品，初始库存100
      json:
        name: EX_MATERIAL_SC6_${fixed_timestamp()}
        brand: 异常测试
        mnemonic: exsc6
        categoryId: 91
        unit: 支
        meList:
          - barCode: "${gen_bar_code()}"
            commodityUnit: "支"
            purchaseDecimal: "29"
            commodityDecimal: "29"
            wholesaleDecimal: "29"
            lowDecimal: "25"
        stock:
          - id: "124"
            name: "自动化测试专属仓库3"
            initStock: "100"
            lowSafeStock: "1"
            highSafeStock: "9999"
      validation:
        - contains: { 'code': 200, 'message': '成功' }

- baseInfo:
    api_name: 创建销售出库单-欠款29
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建销售出库单，数量1，欠款29
      json:
        info: '{"number":"EX_SO_SC6_${fixed_timestamp()}","type":"出库","subType":"销售","organId":204,"accountId":86,"totalPrice":29,"changeAmount":0,"debt":29,"discount":0,"discountMoney":0,"discountLastMoney":29,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"EX_MATERIAL_SC6_${fixed_timestamp()}","barCode":"${get_extract_data(barCode)}","depotId":124,"operNumber":1,"unitPrice":29,"allPrice":29,"unit":"支","taxRate":0,"taxMoney":0,"taxLastMoney":29}]'
      validation:
        - contains: { 'code': 200 }
        - eq: { 'msg': '操作成功' }

- baseInfo:
    api_name: 按单据编号查询销售出库单
    url: /depotHead/getDetailByNumber
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 按单号查询-提取出库单ID和欠款信息
      params:
        number: EX_SO_SC6_${fixed_timestamp()}
      extract:
        exSaleId_SC6: $.data.id
        exSaleOrganId_SC6: $.data.organId
        exSaleNumber_SC6: $.data.number
        exSaleDebt_SC6: $.data.debt
      validation:
        - contains: { 'code': 200, 'type': '出库' }

- baseInfo:
    api_name: 审核销售出库单
    url: /depotHead/batchSetStatus
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 审核出库单（状态置为1）
      json:
        ids: ${get_extract_data(exSaleId_SC6)}
        status: "1"
      validation:
        - contains: { 'code': 200, 'message': '成功' }
        - db: "SELECT id FROM jsh_depot_head WHERE id = ${get_extract_data(exSaleId_SC6)} AND status = '1' AND delete_flag = '0'"

- baseInfo:
    api_name: 超额收款边界场景-系统允许-数据一致性校验
    url: /accountHead/addAccountHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 当前ERP系统允许超额收款，按实际返回成功断言，重点校验数据一致性
      json:
        info: '{"organId":${get_extract_data(exSaleOrganId_SC6)},"billTime":"${end_time()}","billNo":"EX_SK_SC6_${fixed_timestamp()}","accountId":105,"totalPrice":999,"discountMoney":0,"changeAmount":999,"type":"收款","status":"0"}'
        rows: '[{"id":"${get_extract_data(exSaleId_SC6)}","billNumber":"${get_extract_data(exSaleNumber_SC6)}","needDebt":"${get_extract_data(exSaleDebt_SC6)}","finishDebt":"0","eachAmount":"999","remark":""}]'
      validation:
        - contains: { 'code': 200, 'msg': '操作成功' }
        - db_eq:
            sql: "select count(*) from jsh_account_head where bill_no LIKE 'EX_SK_SC6_%' AND delete_flag = '0'"
            expect: 1
        - db: "SELECT id FROM jsh_account_item WHERE header_id IN (SELECT id FROM jsh_account_head WHERE bill_no LIKE 'EX_SK_SC6_%' AND delete_flag = '0')"
