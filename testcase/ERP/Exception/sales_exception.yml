- baseInfo:
    api_name: 第一次提交销售出库单-应成功
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 使用固定单号第一次提交，期望成功
      json:
        info: '{"number":"AUTO_API_EX_SO_SC4_${fixed_timestamp()}","type":"出库","subType":"销售","organId":${get_business_id(customer_organ_id)},"accountId":${get_business_id(settle_account_id)},"totalPrice":29,"changeAmount":0,"debt":29,"discount":0,"discountMoney":0,"discountLastMoney":29,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"AUTO_API_EX_SC4_${fixed_timestamp()}","barCode":"${get_extract_data(barCode)}","depotId":${get_business_id(depot_id)},"operNumber":1,"unitPrice":29,"allPrice":29,"unit":"支","taxRate":0,"taxMoney":0,"taxLastMoney":29}]'
      validation:
        - contains: { 'code': 200 }
        - eq: { 'msg': '操作成功' }
        - db_eq:
            sql: "select count(*) from jsh_depot_head where number = 'AUTO_API_EX_SO_SC4_${fixed_timestamp()}' AND delete_flag = '0'"
            expect: 1

- baseInfo:
    api_name: 第二次提交相同销售单号-应拒绝
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 使用相同单号第二次提交，期望拒绝
      json:
        info: '{"number":"AUTO_API_EX_SO_SC4_${fixed_timestamp()}","type":"出库","subType":"销售","organId":${get_business_id(customer_organ_id)},"accountId":${get_business_id(settle_account_id)},"totalPrice":29,"changeAmount":0,"debt":29,"discount":0,"discountMoney":0,"discountLastMoney":29,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"AUTO_API_EX_SC4_${fixed_timestamp()}","barCode":"${get_extract_data(barCode)}","depotId":${get_business_id(depot_id)},"operNumber":1,"unitPrice":29,"allPrice":29,"unit":"支","taxRate":0,"taxMoney":0,"taxLastMoney":29}]'
      # 等待人工确认：重复单号时 ERP 返回的业务错误码和错误信息，确认后在此补充
      # 具体断言；当前先保证未生成第二张单据
      validation:
        - ne: { 'code': 200 }
        - db_eq:
            sql: "select count(*) from jsh_depot_head where number = 'AUTO_API_EX_SO_SC4_${fixed_timestamp()}' AND delete_flag = '0'"
            expect: 1

