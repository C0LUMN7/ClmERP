# ============================================================
# Exception Scenario 3: 销售出库数量大于库存
# ============================================================
- baseInfo:
    api_name: 创建测试商品-库存溢出异常场景
    url: /material/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建商品，初始库存100
      json:
        name: AUTO_API_EX_SC3_${fixed_timestamp()}
        brand: 异常测试
        mnemonic: exsc3
        categoryId: ${get_business_id(category_id)}
        unit: 支
        meList:
          - barCode: "${gen_bar_code()}"
            commodityUnit: "支"
            purchaseDecimal: "29"
            commodityDecimal: "29"
            wholesaleDecimal: "29"
            lowDecimal: "25"
        stock:
          # 仓库 ID 来自配置（cloud_test 默认示例 124），仓库名对应配置的默认仓库
          - id: "${get_business_id(depot_id)}"
            name: "自动化测试专属仓库3"
            initStock: "100"
            lowSafeStock: "1"
            highSafeStock: "9999"
      validation:
        - contains: { 'code': 200, 'message': '成功' }

- baseInfo:
    api_name: 销售出库数量大于库存-应拒绝
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 出库数量传99999，期望接口拒绝
      json:
        info: '{"number":"AUTO_API_EX_SO_SC3_${fixed_timestamp()}","type":"出库","subType":"销售","organId":${get_business_id(customer_organ_id)},"accountId":${get_business_id(settle_account_id)},"totalPrice":2899971,"changeAmount":0,"debt":2899971,"discount":0,"discountMoney":0,"discountLastMoney":2899971,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"AUTO_API_EX_SC3_${fixed_timestamp()}","barCode":"${get_extract_data(barCode)}","depotId":${get_business_id(depot_id)},"operNumber":99999,"unitPrice":29,"allPrice":2899971,"unit":"支","taxRate":0,"taxMoney":0,"taxLastMoney":2899971}]'
      # 已确认缺陷：当前 ERP 实际返回 code=200 并生成未审核单据；
      # 本用例按业务规则保留失败断言，用于暴露超库存创建单据缺陷。
      validation:
        - ne: { 'code': 200 }
        - db_eq:
            sql: "select count(*) from jsh_depot_head where number = 'AUTO_API_EX_SO_SC3_${fixed_timestamp()}' AND delete_flag = '0'"
            expect: 0
        - db_eq:
            sql: "select current_number from jsh_material_current_stock WHERE material_id = (SELECT id FROM jsh_material WHERE name = 'AUTO_API_EX_SC3_${fixed_timestamp()}' AND delete_flag = '0') AND depot_id = ${get_business_id(depot_id)}"
            expect: 100

