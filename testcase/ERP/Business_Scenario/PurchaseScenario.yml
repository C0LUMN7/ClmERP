- baseInfo:
    api_name: 创建商品含条码-采购业务场景
    url: /material/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建商品-采购业务场景
      json:
        name: 洗面奶
        brand: 欧莱雅
        mnemonic: xmn
        categoryId: 91
        unit: 瓶
        meList:
          - barCode: "${gen_bar_code()}"
            commodityUnit: "瓶"
            purchaseDecimal: "10"
            commodityDecimal: "29"
            wholesaleDecimal: "29"
            lowDecimal: "25"
        stock:
          - id: "124"
            name: "自动化测试专属仓库3"
            initStock: "100"
            lowSafeStock: "1"
            highSafeStock: "9999"
      validation:
        - contains: { 'code': 200, 'message': '成功' }
- baseInfo:
    api_name: 新增采购入库单
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 新增入库单-采购业务场景
      json:
        info: '{"number":"BS_PO_${fixed_timestamp()}","type":"入库","subType":"采购","organId":196,"accountId":86,"totalPrice":-29,"changeAmount":0,"debt":29,"discount":0,"discountMoney":0,"discountLastMoney":29,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"洗面奶","barCode":"${get_extract_data(barCode)}","depotId":124,"operNumber":1,"unitPrice":29,"allPrice":29,"unit":"瓶","taxRate":0,"taxMoney":0,"taxLastMoney":29}]'
      validation:
        - contains: { 'code': 200 }
        - eq: { 'msg': '操作成功' }
- baseInfo:
    api_name: 根据单据编号查询采购入库单
    url: /depotHead/getDetailByNumber
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 按编号查询-提取入库单ID供后续使用
      params:
        number: BS_PO_${fixed_timestamp()}
      extract:
        buyId: $.data.id
        buyOrganId: $.data.organId
        buyNumber: $.data.number
        buyTotalPrice: $.data.totalPrice
        buyDebt: $.data.debt
      validation:
        - contains: { 'code': 200, 'type': '入库' }
- baseInfo:
    api_name: 审核采购入库单
    url: /depotHead/batchSetStatus
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 审核入库单（状态置为1）-采购业务场景
      json:
        ids: ${get_extract_data(buyId)}
        status: "1"
      validation:
        - contains: { 'code': 200, 'message': '成功' }
- baseInfo:
    api_name: 新增付款单（采购付款）
    url: /accountHead/addAccountHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 对采购入库单新增付款单-采购业务场景
      json:
        info: '{"organId":${get_extract_data(buyOrganId)},"billTime":"${end_time()}","billNo":"BSFK_${fixed_timestamp()}","accountId":105,"totalPrice":-${get_extract_data(buyDebt)},"discountMoney":0,"changeAmount":-${get_extract_data(buyDebt)},"type":"付款","status":"0"}'
        rows: '[{"id":"${get_extract_data(buyId)}","billNumber":"${get_extract_data(buyNumber)}","needDebt":"${get_extract_data(buyDebt)}","finishDebt":"0","eachAmount":"${get_extract_data(buyDebt)}","remark":""}]'
      validation:
        - contains: { 'code': 200, 'msg': '操作成功' }
