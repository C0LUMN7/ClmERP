- baseInfo:
    api_name: 创建供应商
    url: /supplier/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建供应商-采购入库业务场景
      json:
        supplier: 流程测试供应商
        type: 供应商
        phonenum: "13800000111"
        email: flow@erp.com
      validation:
        - contains: { 'code': 200, 'message': '成功' }
- baseInfo:
    api_name: 查询供应商ID
    url: /supplier/list
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 获取最新供应商ID-供后续步骤使用
      params:
        currentPage: 1
        pageSize: 10
        search: ""
      extract:
        supplierId: $.data.rows[0].id
      validation:
        - contains: { 'code': 200 }
- baseInfo:
    api_name: 创建商品含条码
    url: /material/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建商品并自动生成条码-供采购入库使用
      json:
        name: 采购入库商品_${timestamp()}
        categoryId: 1
        meList:
          - barCode: "${gen_bar_code()}"
            commodityUnit: "个"
      validation:
        - contains: { 'code': 200, 'message': '成功' }
- baseInfo:
    api_name: 创建仓库
    url: /depot/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建仓库-采购入库业务场景
      json:
        name: 流程测试仓库
      validation:
        - contains: { 'code': 200, 'message': '成功' }
- baseInfo:
    api_name: 查询仓库ID
    url: /depot/getAllList
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 获取最新仓库ID-供后续步骤使用
      extract:
        depotId: $.data[0].id
      validation:
        - contains: { 'code': 200 }
- baseInfo:
    api_name: 创建结算账户
    url: /account/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建结算账户-采购入库业务场景
      json:
        name: 流程测试结算账户
        serialNo: "6222021234567890"
        initialAmount: 10000
        remark: 采购入库用账户
      validation:
        - contains: { 'code': 200, 'message': '成功' }
- baseInfo:
    api_name: 查询账户ID
    url: /account/list
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 获取最新账户ID-供后续步骤使用
      params:
        currentPage: 1
        pageSize: 10
        search: ""
      extract:
        accountId: $.data.rows[0].id
      validation:
        - contains: { 'code': 200 }
- baseInfo:
    api_name: 采购入库单
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 使用提取的ID创建采购入库单
      json:
        info: '{"number":"CG${timestamp()}","type":"入库","subType":"采购","organId":${get_extract_data(supplierId)},"accountId":${get_extract_data(accountId)},"totalPrice":100,"changeAmount":0,"payType":"现付","billTime":"2026-06-12","remark":"采购入库_${timestamp()}"}'
        rows: '[{"barCode":"${get_extract_data(barCode)}","depotId":${get_extract_data(depotId)},"operNumber":10,"unitPrice":10,"totalPrice":100,"unit":"个","remark":"入库明细_${timestamp()}"}]'
      validation:
        - contains: { 'code': 200 }
- baseInfo:
    api_name: 验证采购入库统计
    url: /depotHead/getBuyAndSaleStatistics
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 查询采购统计验证入库成功
      validation:
        - contains: { 'code': 200 }
