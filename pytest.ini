[pytest]
filterwarnings =
    error
    ignore::UserWarning

python_files = test_*.py
python_classes = Test*
python_functions = test

markers =
    smoke: 安全且快速的冒烟用例
    single: 单接口测试
    business: ERP 多步骤业务场景
    exception: 异常和边界场景（现有用例保留，后续统一为 negative）
    negative: 异常和边界场景
    e2e: API、UI、数据库跨层闭环
    destructive: 会新增、修改、审核或删除业务数据
