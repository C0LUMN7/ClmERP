[pytest]
# 显式将仓库根目录加入 import 路径，保证 CI/本地都能加载 common、base、conf 等顶层包
pythonpath = .

filterwarnings =
    error
    ignore::UserWarning

python_files = test_*.py
python_classes = Test*
python_functions = test

markers =
    smoke: 安全且快速的冒烟用例
    single: 单接口测试
    business: ERP 多步骤业务场景
    exception: 异常和边界场景（已废弃，统一使用 negative，保留注册避免未登记警告）
    negative: 异常和边界场景
    e2e: API、UI、数据库跨层闭环
    destructive: 会新增、修改、审核或删除业务数据
