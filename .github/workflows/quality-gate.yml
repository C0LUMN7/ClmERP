name: ERP Quality Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true
  GITHUB_ACTIONS: true
  JENKINS_CI: true

jobs:
  lint-and-collect:
    name: Lint and collect tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python compile check
        run: |
          python -m py_compile run.py

      - name: Collect API, UI and E2E tests
        run: |
          python run.py api --collect-only
          python run.py ui --collect-only
          python run.py e2e --collect-only

  api-smoke:
    name: API smoke tests
    runs-on: ubuntu-latest
    needs: lint-and-collect
    timeout-minutes: 30
    env:
      ERP_API_URL: ${{ secrets.ERP_API_URL }}
      ERP_UI_URL: ${{ secrets.ERP_UI_URL }}
      ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
      ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.33.0
          curl -fL --retry 3 -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          mkdir -p .tools/allure
          tar -zxf allure.tgz --strip-components=1 -C .tools/allure
          echo "$GITHUB_WORKSPACE/.tools/allure/bin" >> "$GITHUB_PATH"
          .tools/allure/bin/allure --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check ERP API connectivity
        run: |
          python - <<'PY'
          import os
          import requests
          import urllib3

          url = os.environ.get("ERP_API_URL", "").rstrip("/")
          if not url:
              raise SystemExit("ERP_API_URL is empty")
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          response = requests.get(f"{url}/user/login", timeout=15, verify=False)
          if response.status_code >= 500:
              raise SystemExit(f"ERP API endpoint returned {response.status_code}")
          print(f"ERP_API_URL reachable, status={response.status_code}")
          PY

      - name: Collect API smoke tests for lightweight gates
        if: github.event_name != 'workflow_dispatch'
        run: python run.py api --suite smoke --collect-only

      - name: Run API smoke tests
        if: github.event_name == 'workflow_dispatch'
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        run: python run.py api --suite smoke

      - name: Upload API test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-smoke-artifacts-${{ github.run_id }}
          path: |
            reports/allure-results/api/
            reports/api_results.xml
            !.runtime/**
            !config/local.ini
            !**/.env
            !**/*storage_state*
            !**/*token*
            !**/*Token*
            !**/*password*
            !**/*Password*
            !**/*cookie*
            !**/*Cookie*
            !**/*session*
            !**/*Session*
          retention-days: 14
          if-no-files-found: warn

  ui-smoke:
    name: UI smoke tests
    runs-on: ubuntu-latest
    needs: lint-and-collect
    timeout-minutes: 30
    env:
      ERP_API_URL: ${{ secrets.ERP_API_URL }}
      ERP_UI_URL: ${{ secrets.ERP_UI_URL }}
      ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
      ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USERNAME: disabled
      MYSQL_PASSWORD: disabled
      MYSQL_DATABASE: disabled
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.33.0
          curl -fL --retry 3 -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          mkdir -p .tools/allure
          tar -zxf allure.tgz --strip-components=1 -C .tools/allure
          echo "$GITHUB_WORKSPACE/.tools/allure/bin" >> "$GITHUB_PATH"
          .tools/allure/bin/allure --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check ERP UI connectivity
        run: |
          python - <<'PY'
          import os
          import requests
          import urllib3

          url = os.environ.get("ERP_UI_URL", "").rstrip("/")
          if not url:
              raise SystemExit("ERP_UI_URL is empty")
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          response = requests.get(url, timeout=15, verify=False)
          if response.status_code >= 500:
              raise SystemExit(f"ERP UI endpoint returned {response.status_code}")
          print(f"ERP_UI_URL reachable, status={response.status_code}")
          PY

      - name: Collect UI smoke tests for lightweight gates
        if: github.event_name != 'workflow_dispatch'
        run: python run.py ui --suite smoke --collect-only

      - name: Run UI smoke tests
        if: github.event_name == 'workflow_dispatch'
        run: python run.py ui --suite smoke

      - name: Upload UI test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-smoke-artifacts-${{ github.run_id }}
          path: |
            reports/allure-results/ui/
            reports/ui_results.xml
            reports/playwright/
            !.runtime/**
            !config/local.ini
            !**/.env
            !**/*storage_state*
            !**/*token*
            !**/*Token*
            !**/*password*
            !**/*Password*
            !**/*cookie*
            !**/*Cookie*
            !**/*session*
            !**/*Session*
          retention-days: 14
          if-no-files-found: warn

  e2e-smoke:
    name: E2E smoke tests
    runs-on: ubuntu-latest
    needs:
      - api-smoke
      - ui-smoke
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    env:
      ERP_API_URL: ${{ secrets.ERP_API_URL }}
      ERP_UI_URL: ${{ secrets.ERP_UI_URL }}
      ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
      ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
      MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
      MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.33.0
          curl -fL --retry 3 -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          mkdir -p .tools/allure
          tar -zxf allure.tgz --strip-components=1 -C .tools/allure
          echo "$GITHUB_WORKSPACE/.tools/allure/bin" >> "$GITHUB_PATH"
          .tools/allure/bin/allure --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check ERP API and UI connectivity
        run: |
          python - <<'PY'
          import os
          import requests
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          for name in ("ERP_API_URL", "ERP_UI_URL"):
              url = os.environ.get(name, "").rstrip("/")
              if not url:
                  raise SystemExit(f"{name} is empty")
              response = requests.get(url, timeout=15, verify=False)
              if response.status_code >= 500:
                  raise SystemExit(f"{name} endpoint returned {response.status_code}")
              print(f"{name} reachable, status={response.status_code}")
          PY

      - name: Run E2E smoke tests
        run: python run.py e2e --suite smoke

      - name: Upload E2E test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-smoke-artifacts-${{ github.run_id }}
          path: |
            reports/allure-results/e2e/
            reports/e2e_results.xml
            reports/playwright/
            !.runtime/**
            !config/local.ini
            !**/.env
            !**/*storage_state*
            !**/*token*
            !**/*Token*
            !**/*password*
            !**/*Password*
            !**/*cookie*
            !**/*Cookie*
            !**/*session*
            !**/*Session*
          retention-days: 14
          if-no-files-found: warn
