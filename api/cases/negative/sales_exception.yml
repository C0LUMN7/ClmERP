# ============================================================
# Exception Scenario 3: 销售出库数量大于库存
# ============================================================
- baseInfo:
    api_name: 创建测试商品-库存溢出异常场景
    url: /material/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建商品，初始库存100
      json:
        name: EX_MATERIAL_SC3_${fixed_timestamp()}
        brand: 异常测试
        mnemonic: exsc3
        categoryId: 91
        unit: 支
        meList:
          - barCode: "${gen_bar_code()}"
            commodityUnit: "支"
            purchaseDecimal: "29"
            commodityDecimal: "29"
            wholesaleDecimal: "29"
            lowDecimal: "25"
        stock:
          - id: "124"
            name: "自动化测试专属仓库3"
            initStock: "100"
            lowSafeStock: "1"
            highSafeStock: "9999"
      validation:
        - contains: { 'code': 200, 'message': '成功' }

- baseInfo:
    api_name: 销售出库数量大于库存-应拒绝
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 出库数量传99999，期望接口拒绝
      json:
        info: '{"number":"EX_SO_SC3_${fixed_timestamp()}","type":"出库","subType":"销售","organId":204,"accountId":86,"totalPrice":2899971,"changeAmount":0,"debt":2899971,"discount":0,"discountMoney":0,"discountLastMoney":2899971,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"EX_MATERIAL_SC3_${fixed_timestamp()}","barCode":"${get_extract_data(barCode)}","depotId":124,"operNumber":99999,"unitPrice":29,"allPrice":2899971,"unit":"支","taxRate":0,"taxMoney":0,"taxLastMoney":2899971}]'
      validation:
        - ne: { 'code': 200 }
        - db_eq:
            sql: "select count(*) from jsh_depot_head where number = 'EX_SO_SC3_${fixed_timestamp()}' AND delete_flag = '0'"
            expect: 0
        - db_eq:
            sql: "select current_number from jsh_material_current_stock WHERE material_id IN (SELECT id FROM jsh_material WHERE name LIKE 'EX_MATERIAL_SC3_%' AND delete_flag = '0') AND depot_id = 124"
            expect: 100

