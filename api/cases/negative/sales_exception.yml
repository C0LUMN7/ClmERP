- baseInfo:
    api_name: 按单据编号查询销售出库单
    url: /depotHead/getDetailByNumber
    method: GET
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 按单号查询-提取出库单ID
      params:
        number: EX_SO_SC5_${fixed_timestamp()}
      extract:
        exSaleId_SC5: $.data.id
        exSaleOrganId_SC5: $.data.organId
        exSaleNumber_SC5: $.data.number
        exSaleDebt_SC5: $.data.debt
      validation:
        - contains: { 'code': 200, 'type': '出库' }

- baseInfo:
    api_name: 第一次审核销售出库单-应成功
    url: /depotHead/batchSetStatus
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 审核出库单（状态置为1），首次审核
      json:
        ids: ${get_extract_data(exSaleId_SC5)}
        status: "1"
      validation:
        - contains: { 'code': 200, 'message': '成功' }
        - db: "SELECT id FROM jsh_depot_head WHERE id = ${get_extract_data(exSaleId_SC5)} AND status = '1' AND delete_flag = '0'"
        - db_eq:
            sql: "select current_number from jsh_material_current_stock WHERE material_id IN (SELECT id FROM jsh_material WHERE name LIKE 'EX_MATERIAL_SC5_%' AND delete_flag = '0') AND depot_id = 124"
            expect: 99

- baseInfo:
    api_name: 第二次审核同一张销售出库单-应幂等
    url: /depotHead/batchSetStatus
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 再次审核同一出库单，库存不应重复扣减
      json:
        ids: ${get_extract_data(exSaleId_SC5)}
        status: "1"
      validation:
        - db_eq:
            sql: "select current_number from jsh_material_current_stock WHERE material_id IN (SELECT id FROM jsh_material WHERE name LIKE 'EX_MATERIAL_SC5_%' AND delete_flag = '0') AND depot_id = 124"
            expect: 99
