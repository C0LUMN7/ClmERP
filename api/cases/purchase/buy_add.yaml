- baseInfo:
    api_name: 创建商品（采购入库用）
    url: /material/add
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 创建电动牙刷（采购模块自用）
      json:
        name: 电动牙刷_采购_${fixed_timestamp()}
        brand: 笑容加
        mnemonic: ddys
        categoryId: 91
        unit: 支
        meList:
          - barCode: "${gen_bar_code()}"
            commodityUnit: "支"
            purchaseDecimal: "200"
            commodityDecimal: "299"
            wholesaleDecimal: "299"
            lowDecimal: "259"
        stock:
          - id: "124"
            name: "自动化测试专属仓库3"
            initStock: "100"
            lowSafeStock: "1"
            highSafeStock: "9999"
      validation:
        - contains: { 'code': 200, 'message': '成功' }

- baseInfo:
    api_name: 新增采购入库单
    url: /depotHead/addDepotHeadAndDetail
    method: POST
    header:
      Content-Type: application/json;charset=UTF-8
      X-Access-Token: ${get_extract_data(token)}
  testCase:
    - case_name: 新增入库单
      json:
        info: '{"number":"PO_${fixed_timestamp()}","type":"入库","subType":"采购","organId":196,"accountId":86,"totalPrice":-299,"changeAmount":0,"debt":299,"discount":0,"discountMoney":0,"discountLastMoney":299,"otherMoney":0,"operTime":"${end_time()}","status":"0"}'
        rows: '[{"name":"电动牙刷_采购_${fixed_timestamp()}","barCode":"${get_extract_data(barCode)}","depotId":124,"operNumber":1,"unitPrice":299,"allPrice":299,"unit":"支","taxRate":0,"taxMoney":0,"taxLastMoney":299}]'
      validation:
        - contains: { 'code': 200 }
        - eq: { 'msg': '操作成功' }
        - db: "SELECT id FROM jsh_depot_head WHERE number = 'PO_${fixed_timestamp()}' AND type = '入库' AND delete_flag = '0'"
